<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(#{patient.form.editTitle})}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container pb-5">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1" th:text="#{patient.form.editTitle}">Edit Patient Profile</h2>
                    <p class="text-muted mb-0" th:text="#{patient.form.editSubtitle(${patient.fullName})}">Update personal and contact details.</p>
                </div>
                <a th:href="@{/patients/{id}(id=${patient.id})}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> <span th:text="#{patient.form.backToPatient}">Back to Patient Record</span>
                </a>
            </div>

            <div class="card p-4 p-md-5">
                <form th:action="@{/patients/{id}/edit(id=${patient.id})}" th:object="${patient}" method="post">
                    <!-- Section 1: Basic Information -->
                    <h5 class="section-header border-bottom pb-2 mb-4 text-primary">
                        <i class="bi bi-person-badge"></i> <span th:text="#{patient.form.sec.personal}">Personal & Demographic Information</span>
                    </h5>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold"><span th:text="#{patient.form.firstName}">First Name</span> <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{firstName}"
                                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold"><span th:text="#{patient.form.lastName}">Last Name</span> <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{lastName}"
                                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold"><span th:text="#{patient.form.dob}">Date of Birth</span> <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" th:field="*{dateOfBirth}"
                                   th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold"><span th:text="#{patient.form.gender}">Gender</span> <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{gender}">
                                <option th:each="g : ${genders}" th:value="${g}" th:text="#{${'gender.' + g}}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold" th:text="#{patient.form.bloodGroup}">Blood Group</label>
                            <select class="form-select" th:field="*{bloodGroup}">
                                <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="#{${'bloodgroup.' + bg}}"></option>
                            </select>
                        </div>
                    </div>

                    <!-- Section 2: Contact Information -->
                    <h5 class="section-header border-bottom pb-2 mb-4 text-primary">
                        <i class="bi bi-telephone-inbound"></i> <span th:text="#{patient.form.sec.contact}">Contact Details & Address</span>
                    </h5>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold"><span th:text="#{patient.form.phone}">Phone Number</span> <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{phone}"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold" th:text="#{patient.form.email}">Email Address</label>
                            <input type="email" class="form-control" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold" th:text="#{patient.form.address}">Residential Address</label>
                            <input type="text" class="form-control" th:field="*{address}">
                        </div>
                    </div>

                    <!-- Section 3: Emergency Contact -->
                    <h5 class="section-header border-bottom pb-2 mb-4 text-primary">
                        <i class="bi bi-shield-plus"></i> <span th:text="#{patient.form.sec.emergency}">Emergency Contact</span>
                    </h5>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold" th:text="#{patient.form.emergencyName}">Emergency Contact Name</label>
                            <input type="text" class="form-control" th:field="*{emergencyContactName}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold" th:text="#{patient.form.emergencyPhone}">Emergency Contact Phone</label>
                            <input type="text" class="form-control" th:field="*{emergencyContactPhone}">
                        </div>
                    </div>

                    <!-- Section 4: Medical History -->
                    <h5 class="section-header border-bottom pb-2 mb-4 text-primary">
                        <i class="bi bi-file-earmark-medical"></i> <span th:text="#{patient.form.sec.history}">General Medical History & Allergies</span>
                    </h5>

                    <div class="mb-4">
                        <label class="form-label fw-bold" th:text="#{patient.form.historyNotes}">Background Notes, Past Surgeries, Known Allergies</label>
                        <textarea class="form-control" th:field="*{medicalHistoryNotes}" rows="3"></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/patients/{id}(id=${patient.id})}" class="btn btn-outline-secondary px-4" th:text="#{common.cancel}">Cancel</a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold">
                            <i class="bi bi-check2-circle me-1"></i> <span th:text="#{patient.form.submitSave}">Save Changes</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
