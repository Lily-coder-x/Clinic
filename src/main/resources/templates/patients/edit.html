<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Edit Patient Profile')}"></head>
<body>

<div th:replace="~{fragments/layout :: navbar}"></div>

<div class="container pb-5">
    <div th:replace="~{fragments/layout :: alerts}"></div>

    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <div>
                    <h2 class="fw-bold text-dark mb-1">Edit Patient Profile</h2>
                    <p class="text-muted mb-0">Update personal and contact details for <strong th:text="${patient.fullName}">Patient</strong>.</p>
                </div>
                <a th:href="@{/patients/{id}(id=${patient.id})}" class="btn btn-outline-secondary">
                    <i class="bi bi-arrow-left"></i> Back to Patient Record
                </a>
            </div>

            <div class="card p-4 p-md-5">
                <form th:action="@{/patients/{id}/edit(id=${patient.id})}" th:object="${patient}" method="post">
                    <!-- Section 1: Basic Information -->
                    <h5 class="section-header border-bottom pb-2 mb-4 text-primary">
                        <i class="bi bi-person-badge"></i> Personal & Demographic Information
                    </h5>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">First Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{firstName}"
                                   th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Last Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{lastName}"
                                   th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold">Date of Birth <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" th:field="*{dateOfBirth}"
                                   th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('dateOfBirth')}" th:errors="*{dateOfBirth}"></div>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold">Gender <span class="text-danger">*</span></label>
                            <select class="form-select" th:field="*{gender}">
                                <option th:each="g : ${genders}" th:value="${g}" th:text="${g.displayName}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-bold">Blood Group</label>
                            <select class="form-select" th:field="*{bloodGroup}">
                                <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg.displayName}"></option>
                            </select>
                        </div>
                    </div>

                    <!-- Section 2: Contact Information -->
                    <h5 class="section-header border-bottom pb-2 mb-4 text-primary">
                        <i class="bi bi-telephone-inbound"></i> Contact Details & Address
                    </h5>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Phone Number <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" th:field="*{phone}"
                                   th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Email Address</label>
                            <input type="email" class="form-control" th:field="*{email}"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : ''">
                            <div class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-bold">Residential Address</label>
                            <input type="text" class="form-control" th:field="*{address}">
                        </div>
                    </div>

                    <!-- Section 3: Emergency Contact -->
                    <h5 class="section-header border-bottom pb-2 mb-4 text-primary">
                        <i class="bi bi-shield-plus"></i> Emergency Contact
                    </h5>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Emergency Contact Name</label>
                            <input type="text" class="form-control" th:field="*{emergencyContactName}">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-bold">Emergency Contact Phone</label>
                            <input type="text" class="form-control" th:field="*{emergencyContactPhone}">
                        </div>
                    </div>

                    <!-- Section 4: Medical History -->
                    <h5 class="section-header border-bottom pb-2 mb-4 text-primary">
                        <i class="bi bi-file-earmark-medical"></i> General Medical History & Allergies
                    </h5>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Background Notes, Past Surgeries, Known Allergies</label>
                        <textarea class="form-control" th:field="*{medicalHistoryNotes}" rows="3"></textarea>
                    </div>

                    <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                        <a th:href="@{/patients/{id}(id=${patient.id})}" class="btn btn-outline-secondary px-4">Cancel</a>
                        <button type="submit" class="btn btn-primary px-5 fw-bold">
                            <i class="bi bi-check2-circle me-1"></i> Save Changes
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/layout :: footer}"></div>
</body>
</html>
